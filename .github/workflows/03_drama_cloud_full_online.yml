name: 03 - AI Drama Cloud Studio V3
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
      timezone: 'Africa/Cairo'
permissions:
  contents: write
  models: read
concurrency:
  group: ai-drama-studio-main
  cancel-in-progress: false
jobs:
  one_episode:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      GIT_CHECKPOINT: '1'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_EXPECTED_CHANNEL_ID: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      DRAMA_TOKEN_KEY: ${{ secrets.DRAMA_TOKEN_KEY }}
      DRAMA_ALLOW_UNREVIEWED_PUBLIC: ${{ secrets.DRAMA_ALLOW_UNREVIEWED_PUBLIC }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install operating-system TTS and renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng libsndfile1
      - name: Install CPU-only PyTorch (avoid downloading CUDA packages)
        run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt
      - name: Cache pre-trained Kokoro model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-v3-${{ runner.os }}
      - name: Validate complete project before rendering
        run: python -m unittest discover -s tests -v
      - name: Generate and stage one new episode
        run: python -m studio.main
      - name: Save MP4 for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drama-cloud-preview-${{ github.run_number }}
          path: output/*.mp4
          if-no-files-found: warn
          retention-days: 7
