name: Nightfall Cloud V5 - Safe Studio
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [prepare_auto_episode, validate_stories, prepare_ember_proof, check_instagram, review_publish_config]
        default: prepare_auto_episode
        required: true
      episode:
        type: string
        default: S01_the_last_little_fox_E01
        required: true
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate tracked original series
        if: inputs.action == 'validate_stories' || inputs.action == 'prepare_ember_proof' || inputs.action == 'prepare_auto_episode'
        run: |
          python -m studio.restore
          python -m unittest discover -s tests -v
      - name: Export Ember scene plan only - no video
        if: inputs.action == 'prepare_ember_proof'
        run: |
          mkdir -p output
          cp studio/proofs/ember_E01_proof_plan.json output/ember_E01_proof_plan.json
          echo 'SCENE_PLAN_ONLY: no video was generated or published'
      - name: Download scene plan
        if: inputs.action == 'prepare_ember_proof'
        uses: actions/upload-artifact@v4
        with:
          name: ember-cinematic-plan-only
          path: output/ember_E01_proof_plan.json
          if-no-files-found: error
          retention-days: 7
      - name: Automatically prepare cast, voices and shot jobs
        if: inputs.action == 'prepare_auto_episode'
        env:
          EPISODE_ID: ${{ inputs.episode }}
        run: python -m studio.auto_prepare --episode "$EPISODE_ID" --output output/automated_episode_pack.json
      - name: Export automatic episode preparation
        if: inputs.action == 'prepare_auto_episode'
        uses: actions/upload-artifact@v4
        with:
          name: automatic-episode-preproduction-pack
          path: output/automated_episode_pack.json
          if-no-files-found: error
          retention-days: 14
      - name: Read-only Instagram check
        if: inputs.action == 'check_instagram'
        run: python -m studio.check
      - name: Check publishing secrets presence without printing values
        if: inputs.action == 'review_publish_config'
        run: |
          python - <<'PY'
          import os
          for name in ('INSTAGRAM_ACCESS_TOKEN','INSTAGRAM_ACCOUNT_ID','YOUTUBE_REFRESH_TOKEN','FB_PAGE_ACCESS_TOKEN','TIKTOK_REFRESH_TOKEN'):
              print(name, 'configured' if os.getenv(name) else 'missing')
          print('Public publishing remains disabled.')
          PY
