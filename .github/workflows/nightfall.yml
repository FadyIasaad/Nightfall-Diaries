name: Nightfall Diaries - One Free Online Workflow

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 10 * * *'
      timezone: 'Africa/Cairo'
    # Safe resume check, NOT a second publishing schedule.
    - cron: '0 23 * * *'
      timezone: 'Africa/Cairo'
  workflow_dispatch:
    inputs:
      action:
        description: "Choose one operation. No manual video uploads."
        type: choice
        options:
          - Check setup
          - Check free motion provider
          - Kaggle GPU check
          - Kaggle diagnose last run
          - Kaggle Ember proof
          - Render quality proof
          - Audition character voices
          - Generate full episode
          - Generate another episode
          - Generate + Publish
          - Retry missing platforms
          - Prepare episode
          - Validate stories
          - Check Instagram
        default: Check setup
        required: true
      episode:
        description: "auto or an original episode ID"
        type: string
        default: auto
        required: true
      mode:
        description: "Optional authorized no-cost engine diagnostic; never creates video."
        type: choice
        options:
          - none
          - engine_probe
        default: none
        required: true

permissions:
  contents: write

# Separate PR validation and ordinary push checks from the single production lane.
# Keep schedule/manual runs serialized: they can target the same Kaggle kernel.
# A new PR commit supersedes old PR validation, instead of holding production.
concurrency:
  group: nightfall-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[nightfall-first-motion-proof]') && 'push-check') || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_VIDEO_SPACE: ${{ vars.HF_VIDEO_SPACE }}
      HF_VIDEO_ENDPOINT: ${{ vars.HF_VIDEO_ENDPOINT }}
      HF_VIDEO_ARGS_JSON: ${{ vars.HF_VIDEO_ARGS_JSON }}
      NIGHTFALL_LIVE: ${{ vars.NIGHTFALL_LIVE }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_POST_MODE: ${{ vars.TIKTOK_POST_MODE }}
    steps:
      - name: Checkout original series and studio
        uses: actions/checkout@v5

      - name: Set up open-source Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate both original stories
        run: python -m studio.restore

      - name: Safety and continuity tests (no render or upload)
        run: python -m unittest discover -s tests -v

      - name: Cloud preflight - safe without video client
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'Check setup') || (github.event_name == 'schedule' && env.NIGHTFALL_LIVE != 'true')
        run: python -m studio.run_free --action check_setup

      - name: Inspect public free motion API (no GPU call)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'Check free motion provider')
        run: python -m studio.motion_provider

      - name: Audit all 14 scenes of original Fox E01 (no video GPU or payment)
        if: github.event_name == 'pull_request'
        run: python -m pilot.e01_pilot --mode audit

      # Exactly ONE authorized clip trial for this pilot PR when first opened.
      # Never on push/main/schedule/other PRs or on synchronize/review updates.
      - name: Try ONE public ZeroGPU first shot of E01 (unpublished 5s candidate)
        if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'pilot/e01-first-clip-one-shot-20261112'
        timeout-minutes: 30
        continue-on-error: true
        env:
          NIGHTFALL_E01_ONE_SHOT: YES_ONCE
          HF_TOKEN: ""
          GH_TOKEN: ""
          YOUTUBE_REFRESH_TOKEN: ""
          YOUTUBE_CLIENT_ID: ""
          YOUTUBE_CLIENT_SECRET: ""
          FB_PAGE_ACCESS_TOKEN: ""
          INSTAGRAM_ACCESS_TOKEN: ""
          INSTAGRAM_ACCOUNT_ID: ""
          TIKTOK_ACCESS_TOKEN: ""
        run: |
          # The GitHub runner image used by this pilot lacked ffprobe.
          # Ensure real MP4 technical validation, not a false provider failure.
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install 'gradio_client>=1.10,<3'
          python -m pilot.e01_pilot --mode one-shot

      - name: Archive first episode render-readiness evidence (never an approved film)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-e01-first-episode-integration
          path: |
            output/e01_pilot/e01_integration_report.json
            output/e01_pilot/e01_all_14_scenes.json
            output/e01_pilot/e01_original_cast_and_3shot_pack.json
          if-no-files-found: error
          retention-days: 7

      - name: Archive ONE unapproved E01 moving clip if the free provider returns it
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'pilot/e01-first-clip-one-shot-20261112'
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-e01-unapproved-first-motion-clip
          path: output/e01_pilot/e01_first_shot_unapproved.mp4
          if-no-files-found: ignore
          retention-days: 7

      # Read-only API metadata only. No billable generation, account changes or posting.
      # Manual only; never called from schedule, push, or pull request.
      - name: Agnes engine probe — GET models only, NO video generation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'engine_probe' && inputs.action == 'Check setup'
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python -m studio.agnes_probe --output output/agnes_engine_probe.json

      - name: Agnes public zero-cost price check + LTX fallback metadata (GET only)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'engine_probe' && inputs.action == 'Check setup'
        run: python -m studio.agnes_cost_gate --output output/agnes_cost_gate.json

      - name: Save read-only Agnes cost gate evidence (no key or generation)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'engine_probe' && inputs.action == 'Check setup'
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-agnes-free-trial-cost-gate
          path: output/agnes_cost_gate.json
          if-no-files-found: error
          retention-days: 7

      - name: Save Agnes safe engine diagnostic (no secrets)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'engine_probe' && inputs.action == 'Check setup'
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-agnes-read-only-engine-probe
          path: output/agnes_engine_probe.json
          if-no-files-found: error
          retention-days: 7

      # Kaggle is opt-in only: no schedule, push, PR, paid API or public upload.
      # The secret is scoped to this manual operation; absent token fails closed.
      - name: Install and smoke-test Kaggle CLI (no GPU or API request)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.action == 'Kaggle GPU check' || inputs.action == 'Kaggle Ember proof' || inputs.action == 'Kaggle diagnose last run'))
        run: |
          # Kaggle CLI currently imports six without requiring it explicitly.
          # Avoid ModuleNotFoundError before dispatching a real GPU task.
          python -m pip install 'kaggle>=1.7,<2' 'six>=1.16,<2'
          # Kaggle currently authenticates during "import kaggle".
          # Pull-request checks must never need account credentials.
          python -c "import six; from importlib.metadata import version; print('Kaggle CLI installed:', version('kaggle'))"
          echo "Dependency check passed; authenticated CLI check is manual only"

      - name: Validate Kaggle token with read-only own-kernels query (no GPU)
        if: github.event_name == 'workflow_dispatch' && (inputs.action == 'Kaggle GPU check' || inputs.action == 'Kaggle Ember proof' || inputs.action == 'Kaggle diagnose last run')
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::KAGGLE_API_TOKEN GitHub Actions secret is missing"
            exit 1
          fi
          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "::error::KAGGLE_USERNAME repository variable is missing"
            exit 1
          fi
          # Kaggle imports authenticate on current CLI versions.
          # This step alone has the Actions secret; PR checks do not.
          python -c "import six; import kaggle; from kaggle.cli import main; print('Authenticated Kaggle CLI import PASSED')"
          kaggle kernels push --help > /dev/null
          # Read-only authentication check. No notebook push, compute, or model use.
          kaggle kernels list --mine --page-size 1 >/dev/null
          echo "Kaggle API authentication passed (does not guarantee GPU quota)"

      - name: Dispatch one private Kaggle T4 notebook (GPU or Ember candidate)
        if: github.event_name == 'workflow_dispatch' && (inputs.action == 'Kaggle GPU check' || inputs.action == 'Kaggle Ember proof' || inputs.action == 'Kaggle diagnose last run')
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          KAGGLE_ACTION: ${{ inputs.action }}
        timeout-minutes: 45
        run: |
          if [ "$KAGGLE_ACTION" = "Kaggle GPU check" ]; then
            python -m studio.kaggle_bridge --mode gpu_probe
          elif [ "$KAGGLE_ACTION" = "Kaggle Ember proof" ]; then
            python -m studio.kaggle_bridge --mode ember_i2v
          elif [ "$KAGGLE_ACTION" = "Kaggle diagnose last run" ]; then
            # Read only: fetch existing Kaggle kernel's status and logs.
            python -m studio.kaggle_bridge --mode diagnose
          else
            exit 1
          fi

      - name: Save free Kaggle execution report (never includes access token)
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.action == 'Kaggle GPU check' || inputs.action == 'Kaggle Ember proof' || inputs.action == 'Kaggle diagnose last run')
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-kaggle-t4-report
          path: |
            output/kaggle_dispatch/kaggle_dispatch.json
            output/kaggle_dispatch/kaggle_diagnostic.json
            output/kaggle_dispatch/kaggle_worker_logs.txt
            output/kaggle_dispatch/kaggle_results/nightfall_kaggle_report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Save unpublished Kaggle Ember candidate MP4 (visual QA only)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.action == 'Kaggle Ember proof'
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-kaggle-ember-unapproved-mp4
          path: output/kaggle_dispatch/kaggle_results/nightfall_ember_candidate.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Read-only Instagram account check
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'Check Instagram'
        run: python -m studio.check

      - name: Restore previous free-cloud animation checkpoints
        if: github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[nightfall-first-motion-proof]')) || (github.event_name == 'workflow_dispatch' && (inputs.action == 'Render quality proof' || inputs.action == 'Generate full episode' || inputs.action == 'Generate another episode' || inputs.action == 'Generate + Publish'))
        uses: actions/cache/restore@v4
        with:
          path: output/checkpoints
          key: nightfall-shots-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nightfall-shots-v2-

      - name: Detect pending episode and free-quota reset time
        id: pending_scan
        if: github.event_name == 'schedule'
        run: python -m studio.pending --detect

      - name: Daily standby when nothing is pending (no publication)
        if: github.event_name == 'schedule' && env.NIGHTFALL_LIVE != 'true' && steps.pending_scan.outputs.has_pending != 'true' && github.event.schedule == '0 10 * * *'
        run: python -m studio.run_free --action scheduled

      - name: Install free rendering and neural voice dependencies
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[nightfall-first-motion-proof]')) || (github.event_name == 'schedule' && ((env.NIGHTFALL_LIVE == 'true' && github.event.schedule == '0 10 * * *') || steps.pending_scan.outputs.has_pending == 'true')) || (github.event_name == 'workflow_dispatch' && (inputs.action == 'Render quality proof' || inputs.action == 'Audition character voices' || inputs.action == 'Generate full episode' || inputs.action == 'Generate another episode' || inputs.action == 'Generate + Publish'))
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install -r requirements.txt

      - name: Audition the locked neural cast (no video or posting)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'Audition character voices'
        run: python -m studio.voice_audition --series S01_the_last_little_fox

      - name: Run one-button production (publishing blocked until proven)
        timeout-minutes: 100
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[nightfall-first-motion-proof]')) || (github.event_name == 'schedule' && ((env.NIGHTFALL_LIVE == 'true' && github.event.schedule == '0 10 * * *') || steps.pending_scan.outputs.has_pending == 'true')) || (github.event_name == 'workflow_dispatch' && (inputs.action == 'Render quality proof' || inputs.action == 'Generate full episode' || inputs.action == 'Generate another episode' || inputs.action == 'Generate + Publish' || inputs.action == 'Retry missing platforms'))
        env:
          REQUESTED_ACTION: ${{ inputs.action }}
          REQUESTED_EPISODE: ${{ inputs.episode }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            if [ "$NIGHTFALL_LIVE" = "true" ] && [ "${{ github.event.schedule }}" = "0 10 * * *" ]; then
              python -m studio.run_free --action scheduled
            else
              python -m studio.run_free --action resume_pending
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python -m studio.run_free --action render_quality_proof
          else
            case "$REQUESTED_ACTION" in
              "Render quality proof") MODE=render_quality_proof ;;
              "Generate full episode") MODE=generate_full_episode ;;
              "Generate another episode") MODE=generate_another_episode ;;
              "Generate + Publish") MODE=generate_and_upload ;;
              "Retry missing platforms") MODE=retry_missing_platforms ;;
              *) echo "Unrecognized mode" >&2; exit 1 ;;
            esac
            python -m studio.run_free --action "$MODE" --episode "$REQUESTED_EPISODE"
          fi

      - name: Build original episode shot / cast pack
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'Prepare episode'
        env:
          EPISODE: ${{ inputs.episode }}
        run: |
          if [ "$EPISODE" = auto ]; then EPISODE=S01_the_last_little_fox_E01; fi
          python -m studio.auto_prepare --episode "$EPISODE" --output output/automated_episode_pack.json

      - name: Save completed scenes even when free quota interrupts the run
        if: always() && hashFiles('output/checkpoints/episode_queue.json') != ''
        uses: actions/cache/save@v4
        with:
          path: output/checkpoints
          key: nightfall-shots-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Machine-readable episode pause/result (not an upload receipt)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-render-status
          path: output/render_status.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Readiness report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-readiness
          path: output/nightfall_setup_report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Neural cast audition WAV files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-original-character-voice-auditions
          path: output/voice_auditions/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Read-only free model availability report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-zero-budget-provider-diagnostics
          path: output/motion_provider_report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Partial animated clips and voice (even on failed free quota)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-motion-progress-clips
          path: |
            output/*_norm_*.mp4
            output/*_line_*.wav
          if-no-files-found: ignore
          retention-days: 7

      - name: Cinematic motion candidate MP4
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-real-motion-candidate
          path: output/*_proof.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Original full film (only if technical QA passed)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-full-episode
          path: output/*_full.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Automated cast and voice directions
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-production-direction
          path: output/automated_episode_pack.json
          if-no-files-found: ignore
          retention-days: 7
