name: Nightfall Diaries — 10 AM Cairo Auto Studio
on:
  schedule:
    - cron: '0 10 * * *'
      timezone: 'Africa/Cairo'
  workflow_dispatch:
    inputs:
      action:
        description: 'Generate + Upload is blocked until video and publishing adapters are proven'
        type: choice
        options: [check_setup, generate_and_upload, generate_only, prepare_auto_episode, validate_stories, check_instagram]
        default: check_setup
        required: true
      episode:
        description: 'auto chooses next unfinished episode'
        type: string
        default: auto
        required: true
concurrency:
  group: nightfall-studio-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      NIGHTFALL_VIDEO_PROVIDER_URL: ${{ secrets.NIGHTFALL_VIDEO_PROVIDER_URL }}
      NIGHTFALL_VIDEO_PROVIDER_TOKEN: ${{ secrets.NIGHTFALL_VIDEO_PROVIDER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all tracked episode scripts and continuity tests
        if: github.event_name == 'schedule' || inputs.action != 'check_instagram'
        run: |
          python -m studio.restore
          python -m unittest discover -s tests -v
      - name: Scheduled pipeline readiness check
        if: github.event_name == 'schedule'
        run: python -m studio.production --action scheduled
      - name: Check automatic cinematic workflow setup
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'check_setup'
        run: python -m studio.production --action check_setup
      - name: Generate + Upload button (fails closed until ready)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'generate_and_upload'
        env:
          REQUESTED_EPISODE: ${{ inputs.episode }}
        run: python -m studio.production --action generate_and_upload --episode "$REQUESTED_EPISODE"
      - name: Generate-only button (fails closed until ready)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'generate_only'
        env:
          REQUESTED_EPISODE: ${{ inputs.episode }}
        run: python -m studio.production --action generate_only --episode "$REQUESTED_EPISODE"
      - name: Prepare entire cast, voices and shots in one click
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'prepare_auto_episode'
        env:
          REQUESTED_EPISODE: ${{ inputs.episode }}
        run: |
          if [ "$REQUESTED_EPISODE" = auto ]; then
            REQUESTED_EPISODE=$(python -c 'from studio.production import next_episode; print(next_episode())')
          fi
          python -m studio.auto_prepare --episode "$REQUESTED_EPISODE" --output output/automatic_episode_pack.json
      - name: Download automatic preproduction pack
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'prepare_auto_episode'
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-episode-pack
          path: output/automatic_episode_pack.json
          if-no-files-found: error
          retention-days: 14
      - name: Instagram read-only check
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'check_instagram'
        run: python -m studio.check
      - name: Always export status report when available
        if: always() && (github.event_name == 'schedule' || inputs.action == 'check_setup' || inputs.action == 'generate_and_upload' || inputs.action == 'generate_only')
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-production-status
          path: output/production_readiness.json
          if-no-files-found: ignore
          retention-days: 14
