name: Nightfall Diaries - One Free Online Workflow

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 10 * * *'
      timezone: 'Africa/Cairo'
  workflow_dispatch:
    inputs:
      action:
        description: "Choose one operation. No manual video uploads."
        type: choice
        options:
          - Check setup
          - Check free motion provider
          - Render quality proof
          - Audition character voices
          - Generate full episode
          - Generate + Publish
          - Retry missing platforms
          - Prepare episode
          - Validate stories
          - Check Instagram
        default: Check setup
        required: true
      episode:
        description: "auto or an original episode ID"
        type: string
        default: auto
        required: true

permissions:
  contents: write

concurrency:
  group: nightfall-free-cloud-studio
  cancel-in-progress: false

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_VIDEO_SPACE: ${{ vars.HF_VIDEO_SPACE }}
      HF_VIDEO_ENDPOINT: ${{ vars.HF_VIDEO_ENDPOINT }}
      HF_VIDEO_ARGS_JSON: ${{ vars.HF_VIDEO_ARGS_JSON }}
      NIGHTFALL_LIVE: ${{ vars.NIGHTFALL_LIVE }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_POST_MODE: ${{ vars.TIKTOK_POST_MODE }}
    steps:
      - name: Checkout original series and studio
        uses: actions/checkout@v5

      - name: Set up open-source Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate both original stories
        run: python -m studio.restore

      - name: Safety and continuity tests (no render or upload)
        run: python -m unittest discover -s tests -v

      - name: Cloud preflight - safe without video client
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'Check setup') || (github.event_name == 'schedule' && env.NIGHTFALL_LIVE != 'true')
        run: python -m studio.run_free --action check_setup

      - name: Inspect public free motion API (no GPU call)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'Check free motion provider')
        run: python -m studio.motion_provider

      - name: Daily standby (no publication)
        if: github.event_name == 'schedule' && env.NIGHTFALL_LIVE != 'true'
        run: python -m studio.run_free --action scheduled

      - name: Read-only Instagram account check
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'Check Instagram'
        run: python -m studio.check

      - name: Install free rendering and neural voice dependencies
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[nightfall-first-motion-proof]')) || (github.event_name == 'schedule' && env.NIGHTFALL_LIVE == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.action == 'Render quality proof' || inputs.action == 'Audition character voices' || inputs.action == 'Generate full episode' || inputs.action == 'Generate + Publish'))
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install -r requirements.txt

      - name: Audition the locked neural cast (no video or posting)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'Audition character voices'
        run: python -m studio.voice_audition --series S01_the_last_little_fox

      - name: Run one-button production (publishing blocked until proven)
        timeout-minutes: 100
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[nightfall-first-motion-proof]')) || (github.event_name == 'schedule' && env.NIGHTFALL_LIVE == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.action == 'Render quality proof' || inputs.action == 'Generate full episode' || inputs.action == 'Generate + Publish' || inputs.action == 'Retry missing platforms'))
        env:
          REQUESTED_ACTION: ${{ inputs.action }}
          REQUESTED_EPISODE: ${{ inputs.episode }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python -m studio.run_free --action scheduled
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python -m studio.run_free --action render_quality_proof
          else
            case "$REQUESTED_ACTION" in
              "Render quality proof") MODE=render_quality_proof ;;
              "Generate full episode") MODE=generate_full_episode ;;
              "Generate + Publish") MODE=generate_and_upload ;;
              "Retry missing platforms") MODE=retry_missing_platforms ;;
              *) echo "Unrecognized mode" >&2; exit 1 ;;
            esac
            python -m studio.run_free --action "$MODE" --episode "$REQUESTED_EPISODE"
          fi

      - name: Build original episode shot / cast pack
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'Prepare episode'
        env:
          EPISODE: ${{ inputs.episode }}
        run: |
          if [ "$EPISODE" = auto ]; then EPISODE=S01_the_last_little_fox_E01; fi
          python -m studio.auto_prepare --episode "$EPISODE" --output output/automated_episode_pack.json

      - name: Readiness report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-readiness
          path: output/nightfall_setup_report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Neural cast audition WAV files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-original-character-voice-auditions
          path: output/voice_auditions/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Read-only free model availability report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-zero-budget-provider-diagnostics
          path: output/motion_provider_report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Partial animated clips and voice (even on failed free quota)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-motion-progress-clips
          path: |
            output/*_norm_*.mp4
            output/*_line_*.wav
          if-no-files-found: ignore
          retention-days: 7

      - name: Cinematic motion candidate MP4
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-real-motion-candidate
          path: output/*_proof.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Original full film (only if technical QA passed)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-full-episode
          path: output/*_full.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Automated cast and voice directions
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightfall-production-direction
          path: output/automated_episode_pack.json
          if-no-files-found: ignore
          retention-days: 7
